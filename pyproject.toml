[project]
name = "agent-memory"
version = "0.1.0"
description = "可本地自托管的通用智能体记忆系统"
requires-python = ">=3.12,<3.13"
dependencies = ["agent-memory-api", "agent-memory-core", "memory-mcp"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/memory-core", "packages/mcp-stdio"]

[tool.uv.sources]
agent-memory-api = { workspace = true }
agent-memory-core = { workspace = true }
memory-mcp = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    # 根目录 `uv run pytest` 会加载集成/评测 conftest；testcontainers 必须
    # 在默认 dev 组里，否则全新 clone 直接报 ModuleNotFoundError。
    "testcontainers[postgres]>=4.9,<5",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/memory-core/tests", "packages/mcp-stdio/tests"]
# perf 基准需要真实容器与 1 万条数据，默认不参与普通测试；
# 需要时显式运行 `uv run pytest apps/api/tests/perf -m perf`。
addopts = "-ra -m 'not perf'"
markers = [
    "integration: 需要 Docker 的集成测试",
    "eval: 黄金集评测（默认参与）",
    "perf: 性能基准，需显式 -m perf",
]
