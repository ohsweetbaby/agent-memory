[project]
name = "agent-memory"
version = "0.1.0"
description = "可本地自托管的通用智能体记忆系统"
requires-python = ">=3.12,<3.13"
dependencies = ["agent-memory-api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
agent-memory-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
addopts = "-ra"
markers = [
    "integration: 需要 Docker 的集成测试",
]
