[project]
name = "agent-memory-api"
version = "0.1.0"
description = "Agent Memory REST、MCP 与任务调度服务"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "prometheus-client>=0.21,<1",
    "httpx>=0.27,<1",
    "celery[redis]>=5.4,<6",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "argon2-cffi>=23.1,<26",
    "itsdangerous>=2.2,<3",
    "cryptography>=43,<47",
    "redis>=5,<7",
    "qdrant-client>=1.12,<1.13",
    "neo4j>=5.26,<6",
    "jieba>=0.42.1",
    "sse-starlette>=2.1,<4",
    "mcp>=1.30,<1.31",
]

[project.optional-dependencies]
# 本地嵌入是可选项：未安装时模块仍可导入，只有真正调用本地 provider 才报错。
local-embeddings = ["sentence-transformers>=3.3,<6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "testcontainers[postgres]>=4.9,<5",
]
