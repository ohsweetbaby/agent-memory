[project]
name = "memory-mcp"
version = "0.1.0"
description = "Agent Memory 的 stdio MCP 薄桥：把工具调用转发到 HTTP /mcp"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.9,<2",
    "httpx>=0.27,<1",
]

[project.scripts]
memory-mcp = "memory_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory_mcp"]
