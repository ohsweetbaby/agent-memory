name: agent-memory-lite

# 无 Neo4j 的降级组合：仅保留 Postgres、Qdrant、Redis、api、worker、web。
# 关系图与多跳扩展不可用，/health 中 neo4j 会显示为 false。
x-app-environment: &app-environment
  ENVIRONMENT: "${ENVIRONMENT:-development}"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  SECRET_KEY: "${SECRET_KEY:-dev-only-change-me}"
  DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-agent_memory}:${POSTGRES_PASSWORD:-agent_memory}@postgres:5432/${POSTGRES_DB:-agent_memory}"
  REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
  QDRANT_URL: "${QDRANT_URL:-http://qdrant:6333}"
  NEO4J_URI: ""
  NEO4J_USER: "${NEO4J_USER:-neo4j}"
  NEO4J_PASSWORD: "${NEO4J_PASSWORD:-agent-memory-dev}"
  ASSETS_DIR: /data/assets
  EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-openai}"
  EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-small}"
  EMBEDDING_DIM: "${EMBEDDING_DIM:-1536}"
  LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
  LLM_API_KEY: "${LLM_API_KEY:-}"
  CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-agent_memory}"
      POSTGRES_USER: "${POSTGRES_USER:-agent_memory}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-agent_memory}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-agent_memory} -d ${POSTGRES_DB:-agent_memory}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment: *app-environment
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - assets_data:/data/assets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command:
      [
        "celery",
        "-A",
        "app.jobs.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
      ]
    environment: *app-environment
    volumes:
      - assets_data:/data/assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.jobs.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org}"
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_data:
  assets_data:
