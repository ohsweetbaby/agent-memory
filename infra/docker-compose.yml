name: agent-memory

# api 与 worker 共享的运行期配置；密钥一律通过环境变量注入。
x-app-environment: &app-environment
  ENVIRONMENT: "${ENVIRONMENT:-development}"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  SECRET_KEY: "${SECRET_KEY:-dev-only-change-me}"
  DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-agent_memory}:${POSTGRES_PASSWORD:-agent_memory}@postgres:5432/${POSTGRES_DB:-agent_memory}"
  REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
  QDRANT_URL: "${QDRANT_URL:-http://qdrant:6333}"
  NEO4J_URI: "${NEO4J_URI:-bolt://neo4j:7687}"
  NEO4J_USER: "${NEO4J_USER:-neo4j}"
  NEO4J_PASSWORD: "${NEO4J_PASSWORD:-agent-memory-dev}"
  ASSETS_DIR: /data/assets
  EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-openai}"
  EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-small}"
  EMBEDDING_DIM: "${EMBEDDING_DIM:-1536}"
  LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
  LLM_API_KEY: "${LLM_API_KEY:-}"
  CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}"
  EXPORT_DIR: /data/exports

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-agent_memory}"
      POSTGRES_USER: "${POSTGRES_USER:-agent_memory}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-agent_memory}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-agent_memory} -d ${POSTGRES_DB:-agent_memory}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-agent-memory-dev}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-agent-memory-dev} 'RETURN 1' || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment: *app-environment
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - assets_data:/data/assets:ro
      - exports_data:/data/exports
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command:
      [
        "celery",
        "-A",
        "app.jobs.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
      ]
    environment: *app-environment
    volumes:
      - assets_data:/data/assets
      - exports_data:/data/exports
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.jobs.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  beat:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command:
      [
        "celery",
        "-A",
        "app.jobs.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
      ]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org}"
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_data:
  neo4j_data:
  assets_data:
  exports_data:
